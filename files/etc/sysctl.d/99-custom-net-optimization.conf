# 4K IPTV & High-Throughput Network Buffers (Airoha AN7581 / ZN504XG-D)
# UDP 核心缓冲区与内存池扩容（统一 16MB 上限，消灭 msd_lite / rtp2httpd / wi-fi 突发溢出丢包）
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152
net.ipv4.udp_mem = 16384 32768 65536
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 10000
net.core.rps_sock_flow_entries = 32768

# 16MB TCP 读写缓冲区与 BBR 拥塞控制（与 30-network-buffers.conf 保持一致，避免热插拔覆盖回退）
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_congestion_control = bbr

# 桥接流量绕过 Netfilter（减轻高码率 25Mbps+ IPTV 组播流的 Conntrack 连接跟踪负担，消除 CPU 抖动）
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0

# ZRAM 与 512MB RAM 虚拟内存调度优化
vm.page-cluster = 0
vm.swappiness = 10
vm.vfs_cache_pressure = 100
vm.watermark_boost_factor = 0

# --- P2P/BT 高并发死连接快速回收 ---
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180
net.netfilter.nf_conntrack_checksum = 0
net.netfilter.nf_conntrack_buckets = 16384
net.netfilter.nf_conntrack_expect_max = 16384

# --- BBRv3 必需的 FQ 队列与 TCP 延迟压制 ---
net.core.default_qdisc = fq
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_fastopen = 3
fs.pipe-max-size = 1048576
